
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7047eb">
  <title>Unitary — Your world. Your community.</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">UNITARY</a>
    <span>Your world. Your community.</span>
  </header>

  <main class="container">
    <section class="hero">
      <p class="eyebrow">ONE WORLD. ONE COMMUNITY.</p>
      <h1>Welcome to Unitary.</h1>
      <p>Connect, share ideas, discover communities and communicate with people worldwide.</p>
    </section>

    <section class="auth-card">
      <h2>Join the community</h2>

      <div class="tabs">
        <button id="loginTab" class="active" type="button">Log in</button>
        <button id="signupTab" type="button">Create account</button>
      </div>

      <form id="authForm">
        <label for="email">Email address</label>
        <input id="email" type="email"
          placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input id="password" type="password"
          minlength="6" placeholder="Your password" required>

        <button id="submitBtn" class="primary" type="submit">
          Log in
        </button>
      </form>

      <button id="googleBtn" type="button">
        Continue with Google
      </button>

      <p id="message" role="status"></p>
    </section>

    <footer>
      © 2026 Unitary. One platform. One worldwide community.
    </footer>
  </main>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
