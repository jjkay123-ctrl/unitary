<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7047eb">
  <title>Unitary — Your world. Your community.</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">UNITARY</a>
    <span>Your world. Your community.</span>
  </header>

  <main class="container">
    <section class="hero">
      <p class="eyebrow">ONE WORLD. ONE COMMUNITY.</p>
      <h1>Welcome to Unitary.</h1>
      <p>Connect, share ideas, discover communities and communicate with people worldwide.</p>
    </section>

    <section class="auth-card">
      <h2>Join the community</h2>
      <div class="tabs">
        <button id="loginTab" class="active" type="button">Log in</button>
        <button id="signupTab" type="button">Create account</button>
      </div>
      <form id="authForm">
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@example.com" required>
        <label for="password">Password</label>
        <input id="password" type="password" minlength="6" placeholder="Your password" required>
        <button id="submitBtn" class="primary" type="submit">Log in</button>
      </form>
      <button id="googleBtn" type="button">Continue with Google</button>
      <p id="message" role="status"></p>
    </section>

    <section id="profileSection" class="auth-card" hidden>
      <h2>Your Unitary Profile</h2>
      <form id="profileForm">
        <label for="displayName">Display name</label>
        <input id="displayName" type="text" placeholder="Your display name" required>

        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Choose a username" required>

        <label for="bio">Biography</label>
        <textarea id="bio" placeholder="Tell the community about yourself"></textarea>

        <label for="profilePicture">Profile picture</label>
        <input id="profilePicture" type="file" accept="image/png,image/jpeg,image/webp">
        <img id="avatarPreview" alt="Profile picture preview" hidden style="width:112px;height:112px;object-fit:cover;border-radius:50%;margin-top:12px;">

        <label for="isPrivate">
          <input id="isPrivate" type="checkbox">
          Make my profile private
        </label>

        <button class="primary" type="submit">Save profile</button>
      </form>
      <p id="profileMessage" role="status"></p>
    </section>

    <footer>
      © 2026 Unitary. One platform. One worldwide community.
    </footer>
  </main>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
  </html>
